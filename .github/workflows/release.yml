name: Release

# Push a tag like v0.1.0 to build the installers on all three systems and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, label: macOS Apple Silicon}
          - {os: macos-13, label: macOS Intel}
          - {os: windows-latest, label: Windows}
          - {os: ubuntu-22.04, label: Linux}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[app,build]"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        run: python packaging/build.py
      - name: Check the built program starts
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   "dist/Agent Control Room.app/Contents/MacOS/Agent Control Room" --version ;;
            Windows) "dist/Agent Control Room/agent-control-room.exe" --version ;;
            Linux)   "dist/Agent Control Room/agent-control-room" --version ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create the release with all installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
